name: Build

on:
  push:
  pull_request:
  release:
    types: [published]

jobs:
  Build:
    runs-on: macos-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    # The .NET 10 iOS workload requires Xcode 26
    - name: Select Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Workloads
      run: |
        dotnet workload install ios

    - name: Build
      shell: pwsh
      run: |
        & ./build.ps1 -BuildNumber "$env:GITHUB_RUN_ID" -IsRelease ($env:GITHUB_EVENT_NAME -eq "release") -BuildNuGet $true -GenerateBindings $false

    - name: NuGet Artifact
      uses: actions/upload-artifact@v4
      with:
        name: NuGet
        path: .build/NuGet/*.nupkg
        if-no-files-found: error

  Publish:
    runs-on: macos-latest
    needs: Build
    if: github.event_name == 'release'
    permissions:
      packages: write
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          name: NuGet
          path: NuGet

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish NuGet
        run: |
          dotnet nuget add source --username USERNAME --password ${{ secrets.GITHUB_TOKEN }} --store-password-in-clear-text --name github "https://nuget.pkg.github.com/idenardi/index.json"
          dotnet nuget push "NuGet/*.nupkg" --source "github"
